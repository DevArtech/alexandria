[workspace]
git_only = true
git_release_enable = false
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]
semver_check = false

[[package]]
name = "alexandria"
version_group = "alexandria"
git_tag_name = "v{{ version }}"
publish = false
changelog_path = "CHANGELOG.md"
changelog_include = ["alexandria-core", "alexandria-mcp", "alexandria-brain"]

[[package]]
name = "alexandria-core"
version_group = "alexandria"
git_tag_name = "v{{ version }}"
publish = false
changelog_update = false

[[package]]
name = "alexandria-mcp"
version_group = "alexandria"
git_tag_name = "v{{ version }}"
publish = false
changelog_update = false

[[package]]
name = "alexandria-brain"
version_group = "alexandria"
git_tag_name = "v{{ version }}"
publish = false
changelog_update = false

[package]
name = "alexandria"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Alexandria CLI — local-first LLM memory"

[[bin]]
name = "alexandria"
path = "src/main.rs"

[dependencies]
alexandria-core = { path = "../core", version = "0.1.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.30"
rmcp = { version = "1.4", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
